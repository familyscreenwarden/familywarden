services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fsw
    volumes:
      - fsw-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsw -d fsw"]
      interval: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://fsw:${POSTGRES_PASSWORD}@db:5432/fsw
    volumes:
      - fsw-data:/data
    ports:
      - "3000:3000"
volumes:
  fsw-db:
  fsw-data:
