# Production setup for one server: HTTPS proxy (Caddy), the console server, and Postgres.
# Run from the repo root:
#   sudo docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: warden
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/init-env.sh first}
      POSTGRES_DB: fsw
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsw -d fsw"]
      interval: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://fsw:${POSTGRES_PASSWORD}@db:5432/fsw
      PUBLIC_URL: https://${APP_DOMAIN}
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - data:/data
    # Not published to the internet: only Caddy reaches it.
    expose:
      - "3000"
volumes:
  db:
  data:
  caddy-data:
  caddy-config:
