<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Texts</title>
<link rel="stylesheet" href="texts.css">
</head>
<body>
<!-- The chats -->
<section id="v-list" class="view on">
  <header class="top">
    <button class="icon" data-act="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></button>
    <h1>Texts</h1>
    <span class="seen">Grown-ups can see texts</span>
  </header>
  <div id="lockcard" class="lockcard hidden">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <div><b id="lock-title">It's bedtime</b><p id="lock-text"></p></div>
  </div>
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search" aria-label="Search texts"></label>
  <div id="chats" class="list"></div>
  <button class="fab" data-act="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New text</button>
</section>

<!-- One chat -->
<section id="v-chat" class="view">
  <header class="chat-top">
    <button class="icon" data-act="back" aria-label="Back to texts"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="who"><b id="c-title"></b><small id="c-sub"></small></div>
    <button class="icon green" id="c-call" data-act="call" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
  </header>
  <div id="msgs" class="msgs"></div>
  <footer class="compose">
    <div id="picks" class="picks hidden"></div>
    <div class="quick" id="quick">
      <button data-quick="On my way">On my way</button><button data-quick="OK">OK</button><button data-quick="Can you pick me up?">Can you pick me up?</button><button data-quick="Love you">Love you</button>
    </div>
    <div id="emoji" class="emoji hidden"></div>
    <div class="row">
      <button class="icon" data-act="gallery" aria-label="Add a photo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 8"/></svg></button>
      <button class="icon" data-act="camera" aria-label="Take a picture"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <label class="field"><textarea id="t" rows="1" placeholder="Text" aria-label="Text message"></textarea>
        <button class="mini" data-act="emoji" aria-label="Add an emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button></label>
      <button class="icon send" data-act="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
    </div>
  </footer>
</section>

<!-- New text: pick people -->
<section id="v-new" class="view">
  <header class="chat-top">
    <button class="icon" data-act="back" aria-label="Back to texts"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="who"><b>New text</b><small>Pick one person, or a few for a group.</small></div>
  </header>
  <div id="people" class="list"></div>
  <div class="new-foot">
    <button class="ghost" data-act="ask">Ask to add a friend</button>
    <button class="primary" id="n-go" data-act="start" disabled>Text</button>
  </div>
</section>

<!-- Sheets -->
<div id="sheet-ask" class="sheet"><div class="panel">
  <i class="grab"></i>
  <h2>Ask to add a friend</h2>
  <p>Your grown-ups get a message. Once they say yes, you can text your friend.</p>
  <label>Friend's name<input id="a-name" maxlength="60" autocomplete="off"></label>
  <label>Their phone number<input id="a-phone" inputmode="tel" maxlength="30" autocomplete="off"></label>
  <label>How do you know them? (optional)<input id="a-note" maxlength="200" autocomplete="off"></label>
  <div class="msg" id="a-msg"></div>
  <div class="btns"><button class="ghost" data-close>Cancel</button><button class="primary" data-act="ask-send">Send to grown-ups</button></div>
</div></div>
<div id="sheet-gallery" class="sheet"><div class="panel tall">
  <i class="grab"></i>
  <h2>Add a photo</h2>
  <div id="grid" class="grid"></div>
  <div class="btns"><button class="ghost" data-close>Done</button></div>
</div></div>

<div id="toast" class="toast"></div>
<script src="texts.js"></script>
</body>
</html>
